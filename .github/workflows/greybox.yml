name: Greybox authoring and host validation
on: [push, pull_request]
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn-blender
          ref: 573fd8aa63c6ef0698f455b7cbd8afaba597d2ce
          path: toolkit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: celsowm/libsaturn
          ref: af86f8518f0d014f2a752ca43035d2278bc9bf8f
          path: sdk-source
          persist-credentials: false
          submodules: false
      - run: python -m unittest discover -s tests
      - run: cc -std=c11 -Wall -Wextra -Werror -I sdk-source/include -I src src/controller.c tests/test_controller.c -o /tmp/controller-test && /tmp/controller-test
      - run: cc -std=c11 -Wall -Wextra -Werror -I src tests/test_debug_clock.c -o /tmp/debug-clock-test && /tmp/debug-clock-test
      - run: cc -std=c11 -Wall -Wextra -Werror -I src tests/test_stage_visibility.c -o /tmp/stage-visibility-test && /tmp/stage-visibility-test
      - run: cc -std=c11 -Wall -Wextra -Werror -I src tests/test_stage_lod.c -o /tmp/stage-lod-test && /tmp/stage-lod-test
      - run: bash -n scripts/qualify-jade-sdk-control-mac.sh
      - run: cc -std=c11 -Wall -Wextra -Werror -I src tests/test_render_profile.c -o /tmp/render-profile-test && /tmp/render-profile-test
      - run: cc -std=c11 -Wall -Wextra -Werror -I src tests/test_ring_frame_clock.c -o /tmp/ring-frame-clock-test && /tmp/ring-frame-clock-test
      - run: python3 tools/bake_xtreme_rings.py /tmp/ring_texture_data.h
      - run: sudo apt-get update && sudo apt-get install -y blender
      - run: blender --version
      - run: |
          blender --background --factory-startup --python-exit-code 1 --python tools/create_jade_gully.py -- toolkit build/jade-gully
          blender --background --factory-startup --python-exit-code 1 --python tools/create_jade_gully.py -- toolkit build/repeat
          for file in jade_gully.json jade_gully.render.obj jade_gully.collision.obj; do
            cmp "build/jade-gully/$file" "build/repeat/$file"
          done
          python toolkit/tools/validate_scene.py build/jade-gully/jade_gully.json
          for dir in build/jade-gully build/repeat; do
            python tools/bake_greybox.py "$dir/jade_gully.render.obj" "$dir/jade_gully.json" "$dir/greybox.h" --collision "$dir/jade_gully.collision.obj" --collision-output "$dir/collision.h"
          done
          cmp build/jade-gully/greybox.h build/repeat/greybox.h
          cmp build/jade-gully/collision.h build/repeat/collision.h
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I sdk-source/include -I build/jade-gully src/main.c
      - run: |
          python tools/validate_adventure_layout.py
          blender --background --factory-startup --python-exit-code 1 --python tools/create_jade_gully_adventure.py -- toolkit build/jade-adventure
          blender --background --factory-startup --python-exit-code 1 --python tools/create_jade_gully_adventure.py -- toolkit build/jade-adventure-repeat
          for file in jade_gully.json jade_gully.render.obj jade_gully.collision.obj; do
            cmp "build/jade-adventure/$file" "build/jade-adventure-repeat/$file"
          done
          python toolkit/tools/validate_scene.py build/jade-adventure/jade_gully.json
          python tools/bake_greybox.py build/jade-adventure/jade_gully.render.obj build/jade-adventure/jade_gully.json build/jade-adventure/greybox.h --collision build/jade-adventure/jade_gully.collision.obj --collision-output build/jade-adventure/collision.h
          python tools/check_adventure_bake.py build/jade-adventure/greybox.h build/jade-adventure/collision.h
          cc -std=c11 -Wall -Wextra -Werror -DXTREME_STAGE_ADVENTURE=1 -fsyntax-only -I sdk-source/include -I src -I build/jade-adventure src/main.c
          python tools/bake_stage_textures.py assets/textures/jade-gully build/jade-adventure/stage_texture_data.h
          python tools/bake_stage_textures.py assets/textures/jade-gully build/jade-adventure-repeat/stage_texture_data.h
          cmp build/jade-adventure/stage_texture_data.h build/jade-adventure-repeat/stage_texture_data.h
          cc -std=c11 -Wall -Wextra -Werror -DXTREME_STAGE_ADVENTURE=1 -fsyntax-only -I sdk-source/include -I src -I build/jade-adventure src/stage_textures.c
      - uses: actions/upload-artifact@v4
        with:
          name: jade-gully-greybox
          path: build/jade-gully/
      - uses: actions/upload-artifact@v4
        with:
          name: jade-gully-adventure-authoring
          path: build/jade-adventure/
