name: Jade Gully V5 Blender visual proof

on:
  push:
    branches: [work/jade-v5-art-direction]
    paths:
      - '.github/workflows/jade-gully-v5-render.yml'
      - 'tools/create_jade_gully_concept_v4.py'
      - 'tools/jade_concept_v4_geometry.py'
      - 'tools/validate_jade_concept_v4.py'
      - 'assets/levels/jade_gully_concept_v4.json'
      - 'tests/test_jade_concept_v4.py'
      - 'tests/test_jade_concept_v5.py'
      - 'scripts/build-jade-concept-v4-mac.sh'
      - 'tools/compile_jade_navigation_v5.py'
      - 'tests/test_jade_navigation_v5.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jade-v5-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: Render actual V5 compare in Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: '1'
      JADE_V4_QUICK: '1'
      # Ubuntu apt Blender is compiled without OpenImageDenoiser.
      JADE_DISABLE_DENOISER: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install background Blender and image-comparison dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --version | head -1
          # Import using Blender's own Python, not only the host python3.
          blender -b --factory-startup --python-exit-code 1 --python-expr "import numpy; print('Blender numpy:', numpy.__version__)"
      - name: Render V5 painting comparison, with source tests
        run: |
          bash scripts/build-jade-concept-v4-mac.sh
      - name: Verify actual images and reproducible scene
        run: |
          set -euo pipefail
          DIR=build/jade-gully-concept-v4
          test -s "$DIR/jade-gully-v4-map.png"
          test -s "$DIR/jade-gully-v4-routes.png"
          test -s "$DIR/jade-gully-v4-sky_bridges.png"
          test -s "$DIR/jade-gully-v4-canyon_basin.png"
          test -s "$DIR/jade-gully-v5-navigation.json"
          test -s "$DIR/jade-gully-v4-clean.png"
          test -s "$DIR/jade-gully-v4-compare.png"
          test -s "$DIR/jade_gully_act1_concept_v4.blend"
          test -s "$DIR/concept-v4-contract.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/jade-gully-concept-v4/concept-v4-contract.json')
          data=json.loads(p.read_text())
          assert data.get('regions') == 5
          assert 'review' in data
          nav=json.loads(Path('build/jade-gully-concept-v4/jade-gully-v5-navigation.json').read_text())
          assert nav['summary']['alternate_count'] == 10
          assert nav['summary']['canyon_landing_platforms'] == 11
          assert nav['summary']['lower_canyon_branches'] == 3
          assert nav['summary']['supported_edges'] >= 10
          assert nav['summary']['aerial_transfer_edges'] == 26
          assert nav['summary']['cloud_landing_platforms'] == 6
          assert all(not edge['physics_verified'] for edge in nav['edges'])
          assert all(not edge['collision_verified'] for edge in nav['edges'])
          print('Verified actual Blender render:',data.get('blender_version'),
                'polygons:',data.get('mesh_polygon_count'))
          PY
      - name: Upload reference/actual comparison for human review
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jade-v5-real-blender-review
          path: |
            build/jade-gully-concept-v4/jade-gully-v4-map.png
            build/jade-gully-concept-v4/jade-gully-v4-routes.png
            build/jade-gully-concept-v4/jade-gully-v4-sky_bridges.png
            build/jade-gully-concept-v4/jade-gully-v4-canyon_basin.png
            build/jade-gully-concept-v4/jade-gully-v5-navigation.json
            build/jade-gully-concept-v4/jade-gully-v4-clean.png
            build/jade-gully-concept-v4/jade-gully-v4-compare.png
            build/jade-gully-concept-v4/concept-v4-contract.json
            build/jade-gully-concept-v4/jade_gully_act1_concept_v4.blend
          retention-days: 14
